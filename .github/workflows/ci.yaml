name: ci

on:
  pull_request:
  push:
    branches:
      - main
      # Where the prereleases are made from.
      - dev
  # Weekly too: new vulnerabilities, and new Go releases, come without a commit.
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Vet
        run: go vet ./...
      -
        # The files of each system, as those of the neighbor table, the temporary addresses and
        # the terminal: every system the release builds for, which nothing else compiles before
        # a tag is public.
        name: Vet for the other systems
        run: |
          for os in darwin freebsd netbsd openbsd solaris windows; do
            echo "== $os"
            GOOS=$os GOARCH=amd64 go vet ./...
          done
      -
        name: Test
        run: go test -race ./...
      -
        # The binary as the release builds it, for this platform only.
        name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target

  # 64-bit atomic operations need an alignment 32-bit platforms don't give by themselves (#2).
  # macOS, with its own sockets, its own mDNS responder beside the program's, and no netlink: the
  # tests that need Linux skip there. The BSDs are built and vetted only.
  test-macos:
    runs-on: macos-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: go test -race ./...

  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: GOARCH=386 go test ./...

  # Discovery over real links, between network namespaces, of one instance and of several at once,
  # and the names real services tell, which the tests run themselves in the namespaces: avahi,
  # Samba's nmbd, systemd-resolved, dnsmasq, udhcpc, dhclient, wsdd2 and lldpd. It needs root.
  live-discovery:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Install the services that tell names
        # Not the machine's own, which the packages start: the tests' are in their namespaces.
        # systemd-resolved is the runner's own already, and stays.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends avahi-daemon samba dnsmasq-base udhcpc isc-dhcp-client wsdd2 lldpd
          sudo systemctl disable --now avahi-daemon.socket avahi-daemon.service smbd nmbd samba-ad-dc wsdd2 lldpd || true
      -
        name: Build
        # The command too, beside the test: two of it run at once.
        run: |
          go test -c -tags integration -o integration.test .
          go build -o ipv6disc ./cmd/ipv6disc
      -
        name: Test
        run: sudo ./integration.test -test.run '^TestLive' -test.v -test.timeout 30m

  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          GOOS=linux go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration .
      -
        # As .golangci.yaml says: the errors nothing checks, and the formatting, of gofmt. On every
        # system of the release, as the vet: each has files the others don't see. And the live
        # tests, which only their tag builds.
        name: Golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          for os in linux darwin freebsd netbsd openbsd solaris windows; do
            echo "== $os"
            GOOS=$os GOARCH=amd64 golangci-lint run ./...
          done
          echo "== linux, integration"
          golangci-lint run --build-tags integration ./...
      -
        # A dependency go.mod lacks, or keeps for nothing, builds here and not for who imports it.
        name: Tidy
        run: go mod tidy -diff

  # Vulnerabilities in the code the module calls, of its dependencies and of Go.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
