name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly too: new vulnerabilities, and new Go releases, come without a commit.
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test -race ./...
      -
        # The binary as the release builds it, for this platform only.
        name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target

  # 64-bit atomic operations need an alignment 32-bit platforms don't give by themselves (#2).
  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: GOARCH=386 go test ./...

  # Discovery over a real link, between two network namespaces: it needs root.
  live-discovery:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Build
        run: go test -c -tags integration -o integration.test .
      -
        name: Test
        run: sudo ./integration.test -test.run '^TestLiveDiscovery$' -test.v -test.timeout 4m

  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          GOOS=linux go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration .

  # Vulnerabilities in the code the module calls, of its dependencies and of Go.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
