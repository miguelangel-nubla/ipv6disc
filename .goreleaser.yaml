version: 2
before:
  hooks:
    - go generate ./...
    - go mod tidy
    # The manual page, compressed as the package has it.
    - sh -c "gzip -9nc docs/ipv6disc.1 > docs/ipv6disc.1.gz"
builds:
  # Every system: the archives, and the images.
  - id: ipv6disc
    main: ./cmd/ipv6disc
    env:
      - CGO_ENABLED=0
    goos:
      # - aix
      # - android
      - darwin
      # - dragonfly
      - freebsd
      # - illumos
      # - ios
      # - js: no sockets, no interfaces: nothing it could do
      - linux
      - netbsd
      - openbsd
      # - plan9
      - solaris
      - windows # weird behaviour NDP packages not received
    goarch:
      - ppc64
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mipsle
      - mips64
      - mips64le
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - 6
      - 7
    # Go 1.26 has no windows/arm: said here, not left to the goreleaser version to skip.
    ignore:
      - goos: windows
        goarch: arm
  # Arch's package is of the architectures Arch has, and Arch Linux ARM: built again, as a
  # package takes every binary of the builds it names.
  - id: packages
    main: ./cmd/ipv6disc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
# One image for every platform: the build context has the binary of each at <os>/<arch>[/<variant>]/.
dockers_v2:
  -
    ids:
      - ipv6disc
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      # A prerelease, as v1.0.0-rc.1, has its own tags only: these stay on the last release.
      # Empty tags are ignored.
      - '{{ if not .Prerelease }}v{{ .Major }}{{ end }}'
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/386
      - linux/amd64
      - linux/arm/v6
      - linux/arm/v7
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"

archives:
  - 
    ids:
      - ipv6disc
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      # The configuration, by example, and what each key of it is.
      - cmd/ipv6disc/example.config.yaml
      - docs/*.md
      - docs/ipv6disc.1
      - docs/reference/*.md
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      formats: [zip]

# A tag with a prerelease part, as v1.0.0-rc.1, is a prerelease on GitHub: not the latest release.
# Arch's package: the command, its manual page and the example of its configuration. It has no
# service: the command is run by hand, or by a program on the library.
nfpms:
  -
    ids:
      - packages
    package_name: ipv6disc
    formats:
      - archlinux
    vendor: Miguel Angel Nubla
    maintainer: Miguel Angel Nubla <miguelangel.nubla@gmail.com>
    homepage: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    description: Finds the hosts on the local network and their addresses, over IPv6 and IPv4
    license: Apache-2.0
    bindir: /usr/bin
    contents:
      - src: docs/ipv6disc.1.gz
        dst: /usr/share/man/man1/ipv6disc.1.gz
      - src: cmd/ipv6disc/example.config.yaml
        dst: /usr/share/doc/ipv6disc/example.config.yaml
      - src: LICENSE.txt
        dst: /usr/share/licenses/ipv6disc/LICENSE
    archlinux:
      packager: Miguel Angel Nubla <miguelangel.nubla@gmail.com>

release:
  prerelease: auto
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

